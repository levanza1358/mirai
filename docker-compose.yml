services:
  mirai:
    image: decolua/mirai:latest
    container_name: mirai
    restart: always
    ports:
      - "1463:1463"
    volumes:
      - mirai-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "1463"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  mirai-data:
    name: mirai-data
